[package]
name = "ordo"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ordo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` backs the system tray (D-01); it pulls in the platform tray APIs.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled", "chrono"] }
refinery = { version = "0.9.2", features = ["rusqlite"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.4"
# 应用内自动更新（R15）：updater 负责 check/download/install，process 提供
# `relaunch()`（它的 `restart` 命令）。两者都由前端调用，权限在
# `capabilities/updater.json` 里只开给主窗。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The taskbar icon (`icons.rs`): tauri has no API for `ICON_BIG`, so the handle
# is built with the same crates tao uses. Pinned to the version tauri already
# depends on, so no second copy lands in the lock file.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
