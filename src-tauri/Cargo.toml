[package]
name = "ordo"
version = "0.1.0"
description = "ordo — personal task book"
authors = ["ordo"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# image-png: the tray decodes its own PNG instead of reusing the window icon.
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4"] }
chrono = "0.4.45"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-global-shortcut = "2.4.1"
keyring = "4.2.0"
# native-tls (Windows schannel) instead of reqwest's default rustls: the one request
# this app makes does not justify statically linking aws-lc into the binary.
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "blocking",
  "native-tls",
  "charset",
  "http2",
  "system-proxy",
] }

# One SetWindowPos per morph frame: tao's set_position/set_size are two window
# updates, and the intermediate rect makes the trailing edge jitter.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
