<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ordo">
  <!-- Ordo = order. Three rows shortening left to right: a list being worked
       down, which is also the shape of every progress bar in the app. -->
  <rect width="32" height="32" rx="8" fill="#06686D"/>
  <rect x="8" y="10" width="16" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="8" y="15" width="11" height="3" rx="1.5" fill="#FFFFFF" opacity="0.72"/>
  <rect x="8" y="20" width="6" height="3" rx="1.5" fill="#FFFFFF" opacity="0.44"/>
</svg>
