<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!--
    The mark, drawn rather than traced: a ring — a disc with its middle and its
    top right cut away — and the accent dot sitting in that gap.

    Geometry measured off the bitmap export this replaces (500x500), then checked
    against it pixel for pixel: the disc is a circle at (250.51, 259.69) with
    r=213.91, its middle a circle at (252.76, 260) with r=130.18 — the two are NOT
    concentric in the original, and that slight weight on one side is the drawing
    — the dot a circle at (375.67, 115.07) with r=61.92, and the gap cut for the
    dot a circle on the dot's own centre with r=88.38, so the gap follows the dot
    instead of being a place someone once measured.

    `logo-dark.svg` and `logo-square.svg` are this drawing again — the first with
    the ring's ink swapped, the second the same bytes — and
    `scripts/gen-logo-assets.mjs` derives both plus the two runtime icons. Edit
    this file only, then run it.
  -->
  <mask id="cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="500">
    <rect width="500" height="500" fill="#fff" />
    <circle cx="252.76" cy="260" r="130.18" fill="#000" />
    <circle cx="375.67" cy="115.07" r="88.38" fill="#000" />
  </mask>
  <circle cx="250.51" cy="259.69" r="213.91" fill="#000000" mask="url(#cuts)" />
  <circle cx="375.67" cy="115.07" r="61.92" fill="#24C68C" />
</svg>
