<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0908" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Ordo：本地优先的任务与项目管理器。" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>Ordo</title>
    <script>
      // Apply the persisted/system theme before the bundle loads to avoid a
      // light-mode flash. Must stay in sync with `src/common/stores/ui.ts`.
      //
      // The canvas colour is set here too: until the bundle mounts the page is
      // empty, and a dark `color-scheme` paints the bare canvas near-black —
      // that is the "black window" during a slow load. Keep it a CSSOM write,
      // never an inline <style>: a style element makes Tauri nonce the
      // production `style-src`, and a nonce voids `'unsafe-inline'`, silently
      // dropping every `style=` the virtual list and Kobalte write. The two
      // values are the theme-color metas above, ~`--background` in index.css.
      (function () {
        try {
          var stored = localStorage.getItem("ordo.theme");
          var dark;
          if (stored === "dark") dark = true;
          else if (stored === "light") dark = false;
          else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.background = dark ? "#0d0908" : "#f5f1ec";
        } catch (e) {
          /* no-op: the store re-applies the theme once JS loads */
        }
      })();
    </script>
  </head>

  <body>
    <noscript>Ordo 需要启用 JavaScript 才能运行。</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
